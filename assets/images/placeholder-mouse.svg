<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#078e49"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-mouse)" rx="12"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <g transform="translate(150, 45)">
    <!-- Mouse Body -->
    <path d="M 50 10 C 80 10 95 40 95 90 C 95 140 80 160 50 160 C 20 160 5 140 5 90 C 5 40 20 10 50 10 Z" fill="#1e293b" stroke="url(#accent-m)" stroke-width="2.5"/>
    <!-- Center Line -->
    <line x1="50" y1="15" x2="50" y2="70" stroke="#475569" stroke-width="1.5"/>
    <!-- Scroll Wheel -->
    <rect x="45" y="30" width="10" height="26" rx="5" fill="#078e49" stroke="#10b981" stroke-width="1.5"/>
    <!-- Grip accents -->
    <path d="M 14 70 Q 20 95 14 120" stroke="#334155" stroke-width="2" fill="none"/>
    <path d="M 86 70 Q 80 95 86 120" stroke="#334155" stroke-width="2" fill="none"/>
  </g>
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">COMPUTER MICE</text>
  <rect x="140" y="248" width="120" height="20" rx="10" fill="#078e49" fill-opacity="0.2" stroke="#078e49" stroke-width="1"/>
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEMO PLACEHOLDER</text>
</svg>
