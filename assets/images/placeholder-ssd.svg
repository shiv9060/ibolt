<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ssd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-ssd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#078e49"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-ssd)" rx="12"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <g transform="translate(100, 50)">
    <!-- NVMe / SSD Board -->
    <rect x="10" y="25" width="180" height="100" rx="8" fill="#1e293b" stroke="url(#accent-ssd)" stroke-width="2.5"/>
    <!-- Memory Chips -->
    <rect x="25" y="40" width="40" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="45" y="80" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">NAND</text>
    <rect x="75" y="40" width="40" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="80" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">NAND</text>
    <rect x="125" y="45" width="30" height="35" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="140" y="67" font-family="monospace" font-size="8" fill="#a7f3d0" text-anchor="middle">CTRL</text>
    <!-- Gold connector pins -->
    <g fill="#fbbf24">
      <rect x="190" y="45" width="10" height="4" rx="1"/>
      <rect x="190" y="53" width="10" height="4" rx="1"/>
      <rect x="190" y="61" width="10" height="4" rx="1"/>
      <rect x="190" y="69" width="10" height="4" rx="1"/>
      <rect x="190" y="77" width="10" height="4" rx="1"/>
      <rect x="190" y="85" width="10" height="4" rx="1"/>
      <rect x="190" y="93" width="10" height="4" rx="1"/>
      <rect x="190" y="101" width="10" height="4" rx="1"/>
    </g>
  </g>
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">STORAGE &amp; SSDS</text>
  <rect x="140" y="248" width="120" height="20" rx="10" fill="#078e49" fill-opacity="0.2" stroke="#078e49" stroke-width="1"/>
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEMO PLACEHOLDER</text>
</svg>
