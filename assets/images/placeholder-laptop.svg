<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-lap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#078e49"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-lap)" rx="12"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <g transform="translate(100, 50)">
    <!-- Laptop Screen -->
    <rect x="25" y="20" width="150" height="95" rx="6" fill="#1e293b" stroke="url(#accent-lap)" stroke-width="2"/>
    <rect x="33" y="28" width="134" height="79" rx="3" fill="#0f172a"/>
    <circle cx="100" cy="24" r="2" fill="#10b981"/>
    <!-- Laptop Base -->
    <path d="M 5 125 L 195 125 L 180 140 L 20 140 Z" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Trackpad notch -->
    <rect x="85" y="125" width="30" height="4" rx="2" fill="#64748b"/>
    <!-- Accessory icon: Power / Stand -->
    <circle cx="100" cy="65" r="18" fill="#078e49" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 95 65 L 105 65 M 100 60 L 100 70" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">LAPTOP ACCESSORIES</text>
  <rect x="140" y="248" width="120" height="20" rx="10" fill="#078e49" fill-opacity="0.2" stroke="#078e49" stroke-width="1"/>
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEMO PLACEHOLDER</text>
</svg>
