<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent-mon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#078e49"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-mon)" rx="12"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <g transform="translate(80, 45)">
    <!-- Stand Base -->
    <ellipse cx="120" cy="155" rx="50" ry="10" fill="#334155"/>
    <!-- Stand Stem -->
    <rect x="112" y="115" width="16" height="42" fill="#475569" rx="3"/>
    <!-- Monitor Bezel -->
    <rect x="10" y="10" width="220" height="130" rx="8" fill="#1e293b" stroke="url(#accent-mon)" stroke-width="2.5"/>
    <!-- Inner Screen -->
    <rect x="18" y="18" width="204" height="114" rx="4" fill="url(#screen-grad)"/>
    <!-- Screen Accent Display -->
    <path d="M 30 100 L 70 70 L 110 85 L 160 45 L 210 75" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="160" cy="45" r="4" fill="#6ee7b7"/>
  </g>
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MONITORS &amp; DISPLAYS</text>
  <rect x="140" y="248" width="120" height="20" rx="10" fill="#078e49" fill-opacity="0.2" stroke="#078e49" stroke-width="1"/>
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEMO PLACEHOLDER</text>
</svg>
