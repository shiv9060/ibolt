<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-cbl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#078e49"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-cable)" rx="12"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <g transform="translate(100, 50)">
    <!-- Braided Cable Coil -->
    <path d="M 30 110 C 20 60 70 30 110 50 C 150 70 170 120 120 140 C 80 150 40 120 70 90 C 90 70 140 70 160 100" fill="none" stroke="url(#accent-cbl)" stroke-width="6" stroke-linecap="round"/>
    <!-- Connector Left -->
    <rect x="15" y="105" width="22" height="14" rx="3" fill="#334155" stroke="#475569"/>
    <rect x="5" y="107" width="10" height="10" rx="2" fill="#94a3b8"/>
    <!-- Connector Right -->
    <rect x="155" y="93" width="26" height="15" rx="3" fill="#334155" stroke="#475569"/>
    <rect x="181" y="95" width="12" height="11" rx="2" fill="#94a3b8"/>
    <!-- Gold Tip -->
    <rect x="190" y="96" width="4" height="9" fill="#fbbf24"/>
  </g>
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">CABLES &amp; ADAPTERS</text>
  <rect x="140" y="248" width="120" height="20" rx="10" fill="#078e49" fill-opacity="0.2" stroke="#078e49" stroke-width="1"/>
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEMO PLACEHOLDER</text>
</svg>
