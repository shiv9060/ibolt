<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-cam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#078e49"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-cam)" rx="12"/>
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <g transform="translate(110, 50)">
    <!-- Base Clamp -->
    <path d="M 60 120 L 120 120 L 110 145 L 70 145 Z" fill="#334155"/>
    <rect x="75" y="95" width="30" height="25" fill="#475569" rx="3"/>
    <!-- Webcam Body -->
    <rect x="10" y="30" width="160" height="65" rx="32" fill="#1e293b" stroke="url(#accent-cam)" stroke-width="2.5"/>
    <!-- Lens Outer -->
    <circle cx="90" cy="62" r="24" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="90" cy="62" r="15" fill="#078e49" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="90" cy="62" r="7" fill="#0f172a"/>
    <!-- LED Indicators -->
    <circle cx="45" cy="62" r="3.5" fill="#10b981"/>
    <circle cx="135" cy="62" r="3" fill="#64748b"/>
    <circle cx="145" cy="62" r="3" fill="#64748b"/>
  </g>
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">HD WEBCAMS &amp; OPTICS</text>
  <rect x="140" y="248" width="120" height="20" rx="10" fill="#078e49" fill-opacity="0.2" stroke="#078e49" stroke-width="1"/>
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">DEMO PLACEHOLDER</text>
</svg>
